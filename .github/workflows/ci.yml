name: Community Extensions — Build, Sign & Deploy (community-signed)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "**/*.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "**/*.json"
      - ".github/workflows/ci.yml"
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-channel:
    name: Resolve Channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - id: channel
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & Sign Community Extensions (${{ needs.resolve-channel.outputs.channel }})
    needs: [resolve-channel]
    runs-on: macos-latest
    steps:
      - name: Checkout extensions
        uses: actions/checkout@v4
        with:
          path: extensions

      - name: Checkout core engine
        uses: actions/checkout@v4
        with:
          repository: rovehq/core
          path: core
          token: ${{ secrets.REGISTRY_PAT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Build Rove CLI
        run: |
          cd core
          cargo build --release -p engine
          cd ..

      - name: Build, sign & bundle each community extension
        env:
          OFFICIAL_PRIV: ${{ secrets.ROVE_TEAM_OFFICIAL_PRIVATE_KEY }}
          COMMUNITY_PRIV: ${{ secrets.ROVE_TEAM_COMMUNITY_PRIVATE_KEY }}
          ROVE_WORKSPACE: ${{ github.workspace }}/rove_workspace
          ROVE_DATA_DIR: ${{ github.workspace }}/rove_data
          ROVE_TEAM_PRIVATE_KEY: ${{ secrets.ROVE_TEAM_COMMUNITY_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p "$ROVE_WORKSPACE" "$ROVE_DATA_DIR"
          mkdir -p artifacts/registry

          cd extensions
          for plugin_dir in plugins/*/ native/*/ channels/*/; do
            [ ! -d "$plugin_dir" ] && continue
            [ ! -f "${plugin_dir}Cargo.toml" ] && continue
            [ ! -f "${plugin_dir}manifest.json" ] && continue
            plugin_name=$(basename "$plugin_dir" | tr -d '/')

            echo "=== Building: $plugin_name ==="
            if [[ "$plugin_dir" == native/* ]]; then
              cargo build -p "$plugin_name" --release
              # For native, rove expects the dylib/so/dll in the root
              find ../target/release -maxdepth 1 -name "lib${plugin_name//-/_}.dylib" -exec cp {} "$plugin_dir" \;
              find ../target/release -maxdepth 1 -name "lib${plugin_name//-/_}.so" -exec cp {} "$plugin_dir" \;
              find ../target/release -maxdepth 1 -name "${plugin_name//-/_}.dll" -exec cp {} "$plugin_dir" \;
              
              ../core/target/release/rove native publish "$plugin_dir" --registry-dir ../artifacts/registry --no-build
            else
              cargo build -p "$plugin_name" --target wasm32-wasip1 --release
              wasm_file=$(echo "$plugin_name" | tr '-' '_').wasm
              cp "../target/wasm32-wasip1/release/$wasm_file" "$plugin_dir"
              
              ../core/target/release/rove plugin publish "$plugin_dir" --registry-dir ../artifacts/registry --no-build
            fi
          done

          find ../artifacts -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: community-extensions-${{ needs.resolve-channel.outputs.channel }}
          path: artifacts/
          retention-days: 1

  deploy:
    name: Deploy to R2 (${{ needs.resolve-channel.outputs.channel }})
    needs: [resolve-channel, build]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: community-extensions-${{ needs.resolve-channel.outputs.channel }}
          path: artifacts/

      - name: Prepare R2 layout
        env:
          CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
        run: |
          mkdir -p ".r2_upload/${CHANNEL}/community"
          cp -r artifacts/registry/. ".r2_upload/${CHANNEL}/community/"
          find .r2_upload -type f | sort

      - name: Deploy to Cloudflare R2
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read --follow-symlinks
        env:
          AWS_S3_BUCKET: ${{ secrets.REGISTRY_R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: "auto"
          AWS_S3_ENDPOINT: ${{ secrets.R2_API_URL }}
          SOURCE_DIR: ".r2_upload"

  update-registry:
    name: Update Registry Repo (${{ needs.resolve-channel.outputs.channel }})
    needs: [resolve-channel, build]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: community-extensions-${{ needs.resolve-channel.outputs.channel }}
          path: artifacts/

      - name: Push to registry repo
        env:
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
          CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
        run: |
          set -e
          git clone https://x-access-token:${REGISTRY_PAT}@github.com/rovehq/registry.git /tmp/registry
          COMMIT=$(git rev-parse --short HEAD)
          mkdir -p "/tmp/registry/${CHANNEL}/community"
          cp -r artifacts/registry/. "/tmp/registry/${CHANNEL}/community/"
          cd /tmp/registry
          git config user.name "rove-ci"
          git config user.email "ci@roveai.co"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "release(${CHANNEL}): community extensions (${COMMIT})"
            git push
          fi
